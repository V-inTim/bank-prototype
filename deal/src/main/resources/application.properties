spring.application.name=deal
spring.datasource.url=jdbc:postgresql://localhost:5433/bank
spring.datasource.username=take
spring.datasource.password=take
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
server.port=8081
calculator.url=http://localhost:8080/calculator
deal.document.url=http://localhost:8081/deal/document
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.default-topic=my-topic